name: Extract ZIP and Flatten

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and flatten ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP tidak ditemukan."
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          rm -rf /tmp/extracted
          mkdir -p /tmp/extracted

          unzip -q "$ZIP_FILE" -d /tmp/extracted

          CURRENT="/tmp/extracted"

          # Masuk terus selama isi folder hanya terdiri
          # dari SATU folder dan tidak ada file lain.
          while true; do
            entries=()

            while IFS= read -r -d '' item; do
              entries+=("$item")
            done < <(find "$CURRENT" -mindepth 1 -maxdepth 1 -print0)

            if [ "${#entries[@]}" -ne 1 ]; then
              break
            fi

            item="${entries[0]}"

            if [ ! -d "$item" ]; then
              break
            fi

            echo "Folder tunggal ditemukan: $item"
            echo "Masuk ke folder..."

            CURRENT="$item"
          done

          echo "Root hasil akhir: $CURRENT"

          echo "Isi yang akan dipindahkan:"
          find "$CURRENT" -maxdepth 2 -print

          # Hapus semua isi repository kecuali .git
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            -exec rm -rf {} +

          # Pindahkan hasil akhir ZIP ke root
          cp -a "$CURRENT"/. .

          echo "Repository setelah extraction:"
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort

      - name: Commit and push
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Extract and flatten ZIP"
          git push origin HEAD:main